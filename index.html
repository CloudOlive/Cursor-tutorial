<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Kaboom.js Platformer (Squares)</title>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			height: 100%;
			background: #111;
			color: #eee;
			font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
		}
		#game {
			width: 100vw;
			height: 90vh;
			display: block;
		}
		#hud {
			height: 10vh;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 16px;
			font-size: 14px;
			color: #bbb;
			user-select: none;
		}
		code {
			background: #222;
			padding: 2px 6px;
			border-radius: 4px;
			color: #ddd;
		}
	</style>
</head>
<body>
	<div id="hud">
		<span>Move: <code>Left/Right</code> or <code>A/D</code></span>
		<span>Jump: <code>Space</code> or <code>W / Up</code></span>
		<span>Reset: <code>R</code></span>
	</div>
	<!-- Kaboom mounts a canvas to document body by default; we size via kaboom config -->
	<script src="https://unpkg.com/kaboom/dist/kaboom.js"></script>
	<script src="./main.js"></script>
</body>
</html>
